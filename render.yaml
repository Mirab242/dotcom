services:
  - type: web
    name: dot-trader-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm run build:render
    startCommand: npm run start:render
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: dot-trader-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # Clés Binance — jamais commitées, à renseigner manuellement dans le dashboard
      # Render (Environment). "sync: false" = valeur gérée à la main dans le dashboard,
      # jamais écrasée par un futur sync du blueprint.
      - key: BINANCE_TESTNET_API_KEY
        sync: false
      - key: BINANCE_TESTNET_API_SECRET
        sync: false
      - key: BINANCE_LIVE_API_KEY
        sync: false
      - key: BINANCE_LIVE_API_SECRET
        sync: false
      # Garde-fou : reste géré à la main dans le dashboard (jamais réécrasé par le blueprint).
      # Ne jamais mettre "true" sans BINANCE_LIVE_API_KEY/SECRET déjà renseignées, et
      # seulement une fois le cadre légal réglé (§8, docs/ARCHITECTURE.md).
      - key: LIVE_TRADING_ENABLED
        sync: false

databases:
  - name: dot-trader-db
    plan: free
    region: frankfurt
